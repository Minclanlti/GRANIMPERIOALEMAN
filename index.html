<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gran Imperio Alemán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#c8102e;
    --snow:#f3f7fc;
    --snow-dim:#a6b0bd;
    --muted:#7d8795;
    --ink:#0c1626;
    --ink-dim:#4a5d77;
    --line:rgba(243,247,252,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(1000px 520px at 50% -10%, rgba(255,255,255,.95), transparent 70%),
      radial-gradient(900px 600px at 100% 100%, rgba(200,16,46,.10), transparent 70%),
      linear-gradient(180deg,#eef6fd 0%,#d5e6f5 45%,#b7d0e8 100%);
    background-attachment:fixed;color:var(--ink);
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh;
  }
  canvas#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

  .flag{position:relative;z-index:6;height:12px;display:flex;flex-direction:column}
  .flag i{flex:1}.flag i:nth-child(1){background:#000}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:var(--red)}

  .topbar{
    position:relative;z-index:5;margin:16px auto 0;width:min(1120px,calc(100% - 32px));
    display:flex;align-items:center;gap:12px;padding:9px 12px 9px 16px;
    border:1px solid rgba(12,22,38,.14);border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.45));box-shadow:0 8px 30px rgba(60,100,150,.15);
    backdrop-filter:blur(6px);
  }
  .topbar>img.logo{width:46px;height:46px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
  .tagline{flex:1;font-style:italic;color:var(--ink-dim);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct{display:none;align-items:center;gap:8px}
  .acct.on{display:flex}
  .chip{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border:1px solid rgba(12,22,38,.2);border-radius:999px;background:rgba(255,255,255,.6);font-size:16px;color:var(--ink);max-width:240px}
  .chip img,.chip .av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
  .chip .av{background:var(--red);color:#fff;display:grid;place-items:center;font-family:'Cinzel',serif;font-size:13px}
  .chip span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip small{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);border-left:1px solid rgba(12,22,38,.25);padding-left:10px;white-space:nowrap}
  .btn{
    font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:#fff;background:linear-gradient(180deg,#e0183a,#a50c25);border:0;border-radius:999px;padding:10px 22px;cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 4px 18px rgba(200,16,46,.35);transition:transform .2s,box-shadow .2s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 6px 26px rgba(200,16,46,.55)}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:0 0 0 1px rgba(12,22,38,.3) inset;padding:9px 16px;font-size:11px}
  .btn.ghost:hover{background:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(12,22,38,.5) inset}

  main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;padding:52px 20px 80px}
  h1{
    font-family:'Cinzel',serif;font-weight:700;font-size:clamp(26px,5.4vw,52px);letter-spacing:.18em;text-transform:uppercase;text-align:center;
    color:var(--ink);padding-bottom:18px;position:relative;
  }
  h1::after{content:"";position:absolute;left:50%;bottom:0;width:min(520px,80%);height:4px;transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,#000 8%,#000 33%,#fff 33%,#fff 66%,var(--red) 66%,var(--red) 92%,transparent);box-shadow:0 0 0 1px rgba(12,22,38,.15)}
  .gl{position:relative;display:inline-block;color:var(--ink);animation:jit 3.4s infinite steps(1)}
  .gl::before,.gl::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
  .gl::before{color:#e0183a;transform:translateX(-3px);mix-blend-mode:multiply;animation:g1 2.3s infinite steps(1)}
  .gl::after{color:#12a0ff;transform:translateX(3px);mix-blend-mode:multiply;animation:g2 2.9s infinite steps(1)}
  .gl.burst{filter:url(#warp)}
  @keyframes g1{0%{clip-path:inset(0 0 85% 0)}10%{clip-path:inset(30% 0 50% 0)}20%{clip-path:inset(70% 0 5% 0)}30%{clip-path:inset(10% 0 70% 0)}40%{clip-path:inset(50% 0 30% 0)}50%{clip-path:inset(0 0 100% 0)}60%{clip-path:inset(80% 0 0 0)}70%{clip-path:inset(20% 0 60% 0)}80%{clip-path:inset(0 0 100% 0)}90%{clip-path:inset(45% 0 40% 0)}100%{clip-path:inset(0 0 100% 0)}}
  @keyframes g2{0%{clip-path:inset(60% 0 20% 0)}12%{clip-path:inset(5% 0 80% 0)}25%{clip-path:inset(40% 0 40% 0)}35%{clip-path:inset(0 0 100% 0)}48%{clip-path:inset(75% 0 8% 0)}60%{clip-path:inset(15% 0 65% 0)}72%{clip-path:inset(0 0 100% 0)}85%{clip-path:inset(55% 0 25% 0)}100%{clip-path:inset(0 0 100% 0)}}
  @keyframes jit{0%,88%,100%{transform:none}89%{transform:translate(3px,-1px) skewX(8deg)}91%{transform:translate(-4px,1px) skewX(-10deg)}93%{transform:translate(2px,0) skewX(4deg)}95%{transform:none}97%{transform:translate(-2px,1px) skewX(-5deg)}}

  .intro{max-width:880px;text-align:center;margin-top:22px;font-size:clamp(17px,2.2vw,20px);line-height:1.55;color:#22344d;font-weight:500}
  .intro a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px;cursor:pointer}
  .intro a:hover{color:var(--red)}

  .halls{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(26px,4vw,56px);margin-top:46px;max-width:1120px}
  .hall{
    width:200px;display:flex;flex-direction:column;align-items:center;text-align:center;
    background:none;border:0;color:inherit;font:inherit;cursor:pointer;
    opacity:0;transform:translateY(18px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .hall:nth-child(1){animation-delay:.15s}.hall:nth-child(2){animation-delay:.3s}.hall:nth-child(3){animation-delay:.45s}.hall:nth-child(4){animation-delay:.6s}
  @keyframes rise{to{opacity:1;transform:none}}
  .disc{
    width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 38%,#26282e 0%,#111216 62%,#08090b 100%);
    border:1.5px solid rgba(243,247,252,.6);
    box-shadow:0 0 0 6px rgba(255,255,255,.55),0 12px 34px rgba(30,60,100,.35),0 0 30px rgba(200,16,46,.25);
    transition:transform .35s,box-shadow .35s,border-color .35s;
  }
  .disc::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px dashed rgba(12,22,38,.35);transition:transform 1.6s linear,border-color .3s}
  .hall:hover .disc,.hall:focus-visible .disc{transform:scale(1.07);border-color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.8),0 16px 44px rgba(30,60,100,.45),0 0 50px rgba(200,16,46,.4)}
  .hall:hover .disc::before{transform:rotate(60deg);border-color:rgba(200,16,46,.7)}
  .hall:focus-visible{outline:none}
  .disc svg.em{width:116px;height:116px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));transition:filter .3s,opacity .3s}
  .hall:hover .disc svg.em{filter:drop-shadow(0 0 10px rgba(210,230,255,.6))}
  .hall h2{margin-top:22px;font-family:'Cinzel',serif;font-weight:600;font-size:14.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);line-height:1.35}
  .hall p{margin-top:6px;font-size:16px;color:var(--ink-dim);line-height:1.35;max-width:200px}
  .lock{position:absolute;top:2px;left:2px;width:34px;height:34px;border-radius:50%;background:var(--red);border:2px solid #0a0a0c;display:none;place-items:center}
  .lock svg{width:16px;height:16px}
  body.guest .hall.gated .lock{display:grid}
  body.guest .hall.gated .disc svg.em{opacity:.5;filter:grayscale(.6)}
  body.guest .hall.gated h2,body.guest .hall.gated p{opacity:.7}

  .foot{position:relative;z-index:2;text-align:center;padding:0 16px 22px;color:var(--ink-dim);font-size:15px}
  .foot b{color:var(--ink);font-weight:600}

  /* Música: solo el botón ON / OFF */
  .music{position:fixed;right:16px;bottom:14px;z-index:9}
  .mbtn{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#f3f7fc;background:rgba(10,12,16,.9);border:1px solid rgba(243,247,252,.3);border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:9px;backdrop-filter:blur(6px);transition:background .2s}
  .mbtn:hover{background:rgba(200,16,46,.9)}
  .mbtn i{width:8px;height:8px;border-radius:50%;background:#7b8391}
  .music.on .mbtn i{background:#ff3b58;box-shadow:0 0 8px #ff3b58}

  /* Bombardeo de fondo */
  canvas#war{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  main.shake{animation:shake .35s linear}
  @keyframes shake{0%,100%{transform:none}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,2px)}}

  /* Pantalla de entrada (solo si el navegador bloquea la música automática) */
  .splash{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center;
    background:radial-gradient(900px 500px at 50% 20%,rgba(255,255,255,.95),transparent 70%),linear-gradient(180deg,#e9f3fc,#b7d0e8);cursor:pointer}
  .splash.on{display:flex;animation:fade .4s}
  .splash h1{font-size:clamp(26px,6vw,56px)}
  .splash p{font-size:19px;color:var(--ink-dim);font-style:italic}

  /* Modal */
  .veil{position:fixed;inset:0;z-index:30;background:rgba(3,4,6,.84);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px}
  .veil.open{display:flex;animation:fade .3s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .panel{
    color:var(--snow);width:min(660px,100%);max-height:90vh;overflow:auto;position:relative;
    background:linear-gradient(180deg,#17181d,#0b0c0f);border:1px solid rgba(243,247,252,.35);border-radius:22px;padding:34px 30px 30px;
    box-shadow:0 30px 90px rgba(0,0,0,.8),0 0 70px rgba(200,16,46,.22);animation:pop .35s cubic-bezier(.2,.8,.2,1);
  }
  .panel.wide{width:min(780px,100%)}
  @keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .panel .x{position:absolute;top:14px;right:16px;background:none;border:0;color:var(--snow-dim);font-size:26px;cursor:pointer;line-height:1}
  .panel .x:hover{color:#fff}
  .panel .big{width:96px;height:96px;margin:0 auto 14px;display:block}
  .panel h3{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--snow);text-align:center;font-size:22px}
  .panel .motto{text-align:center;font-style:italic;color:var(--snow-dim);margin-top:6px}
  .panel .desc{margin-top:18px;line-height:1.6;font-size:18px;color:#d3dae4}
  .panel ul{list-style:none;margin-top:18px;display:grid;gap:10px}
  .panel li.it{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);border-left:3px solid var(--red)}
  .panel li.it strong{display:block;font-family:'Cinzel',serif;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--snow)}
  .panel li.it span{font-size:16px;color:#aab3c0}
  .sbtn{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:12px;border:0;color:#fff;font-family:'Cinzel',serif;font-weight:600;letter-spacing:.12em;font-size:13px;text-transform:uppercase;cursor:pointer}
  .sbtn svg{width:20px;height:20px;fill:#fff}
  .sbtn.dc{background:#5865F2}.sbtn.dc:hover{background:#6b77f5}
  .sbtn.rb{background:#2b2d33;box-shadow:0 0 0 1px var(--line) inset}.sbtn.rb:hover{background:#3a3d45}
  .or{display:flex;align-items:center;gap:12px;margin:18px 0 4px;color:var(--muted);font-size:13px;letter-spacing:.2em}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .panel label{display:block;margin-top:12px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--snow-dim)}
  .panel input.f{width:100%;margin-top:8px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--snow);font:inherit;font-size:18px}
  .panel input.f:focus{outline:none;border-color:#fff}
  .panel .btn{margin-top:14px;width:100%}
  .panel .btn.ghost{color:var(--snow);box-shadow:0 0 0 1px var(--line) inset}
  .panel .fine{margin-top:14px;font-size:14px;color:var(--muted);text-align:center;line-height:1.4}
  .panel .warn{margin-top:12px;font-size:15px;color:#ffc9d0;text-align:center;min-height:20px;line-height:1.4}
  .code{margin:16px 0 4px;padding:14px;text-align:center;font-family:'Cinzel',serif;font-size:22px;letter-spacing:.14em;border:1px dashed rgba(243,247,252,.5);border-radius:12px;background:rgba(255,255,255,.04);user-select:all}
  .steps{margin-top:14px;padding-left:20px;line-height:1.6;font-size:17px;color:#d3dae4}

  /* Fandom */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:0;color:var(--snow-dim);font-family:'Cinzel',serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:#fff;border-bottom-color:var(--red)}
  .wiki p{margin-top:14px;line-height:1.65;font-size:18px;color:#d3dae4}
  .wiki h4{margin-top:20px;font-family:'Cinzel',serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#fff}
  .wiki .tl{margin-top:16px;border-left:2px solid var(--red);padding-left:18px;display:grid;gap:14px}
  .wiki .tl div{position:relative}
  .wiki .tl div::before{content:"";position:absolute;left:-25px;top:7px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--red)}
  .wiki .tl b{font-family:'Cinzel',serif;font-size:15px;color:#fff;letter-spacing:.08em}
  .wiki .tl span{display:block;font-size:17px;color:#b9c2cf;line-height:1.45}
  .wiki table{width:100%;border-collapse:collapse;margin-top:14px;font-size:16px}
  .wiki th,.wiki td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);color:#d3dae4;vertical-align:top}
  .wiki th{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--snow-dim);font-weight:600}

  @media (max-width:700px){
    .tagline{display:none}.topbar{justify-content:space-between;padding-left:12px}
    .chip small{display:none}
    main{padding-top:36px}.hall{width:100%}.halls{gap:44px}
  }
  @media (prefers-reduced-motion:reduce){.hall{animation:none;opacity:1;transform:none}.disc::before{transition:none}}
</style>
</head>

    <symbol id="e-min" viewBox="0 0 100 100">
      <g data-wreath></g>
      <path d="M24 42 L50 24 L76 42 Z" fill="url(#g)"/>

      <rect x="23" y="43" width="54" height="4" fill="#9aa5b3"/>
      <g fill="url(#g)"><rect x="28" y="49" width="6" height="22"/><rect x="40" y="49" width="6" height="22"/><rect x="54" y="49" width="6" height="22"/><rect x="66" y="49" width="6" height="22"/></g>
      <rect x="23" y="71" width="54" height="3" fill="#9aa5b3"/>

      <rect x="15" y="77.5" width="70" height="3.5" fill="#9aa5b3"/>
      <circle cx="50" cy="38" r="2.8" fill="#c8102e" stroke="#fff" stroke-width=".8"/>
    </symbol>
    <!-- Fandom: libro abierto con corona -->
    <symbol id="e-fan" viewBox="0 0 100 100">
      <g data-wreath></g>
      <path d="M50 40 C40 34 28 34 20 38 V68 C28 64 40 64 50 70 Z" fill="url(#g)"/>
      <path d="M50 40 C60 34 72 34 80 38 V68 C72 64 60 64 50 70 Z" fill="#d9e1ec"/>

      <g stroke="#5b6470" stroke-width="1" fill="none"><path d="M26 45 C32 43 38 43 44 46M26 51 C32 49 38 49 44 52M26 57 C32 55 38 55 44 58M56 46 C62 43 68 43 74 45M56 52 C62 49 68 49 74 51M56 58 C62 55 68 55 74 57"/></g>
      <path d="M40 30 L42 22 L46 27 L50 19 L54 27 L58 22 L60 30 Z" fill="#c8102e" stroke="#fff" stroke-width=".8"/>
      <path d="M47 70 L47 80 L50 77 L53 80 L53 70" fill="#c8102e"/>

document.querySelectorAll('[data-wreath]').forEach(g=>{
  let s='';
  for(const side of [-1,1]) for(let i=0;i<9;i++){
    const t=i/8,a=(15+t*95)*Math.PI/180,px=50+side*Math.sin(a)*45,py=50+Math.cos(a)*45;
    s+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="5" ry="2.1" transform="rotate(${(-side*a*180/Math.PI).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)})" fill="#aab4c2" opacity="${(.9-.4*t).toFixed(2)}"/>`;
  }
  g.innerHTML=s;
});

const WIKI={
  'Resumen':`<p>El <b>Imperio Alemán</b> (<i>Deutsches Kaiserreich</i>) existió entre 1871 y 1918. Nació el 18 de enero de 1871 en el Salón de los Espejos de Versalles, al final de la guerra franco-prusiana, cuando el rey Guillermo I de Prusia fue proclamado emperador alemán.</p>
    <p>Era una federación de 25 estados bajo el liderazgo de Prusia, con capital en Berlín. El poder se repartía entre el <b>Kaiser</b>, el <b>Canciller</b> imperial, el <b>Bundesrat</b> (representantes de los estados) y el <b>Reichstag</b>, elegido por sufragio universal masculino.</p>
    <p>En medio siglo pasó de ser un Estado recién unificado a una de las mayores potencias industriales, militares y científicas de Europa. Terminó con la derrota en la Primera Guerra Mundial y la abdicación de Guillermo II en noviembre de 1918.</p>`,
  'Cronología':`<div class="tl">
    <div><b>1871</b><span>Proclamación del Imperio en Versalles. Otto von Bismarck es el primer canciller.</span></div>
    <div><b>1878</b><span>Congreso de Berlín: Bismarck preside la reorganización de los Balcanes.</span></div>
    <div><b>1882</b><span>Triple Alianza entre Alemania, Austria-Hungría e Italia.</span></div>
    <div><b>1884 – 1885</b><span>Conferencia de Berlín y comienzo de las colonias alemanas en África y el Pacífico.</span></div>
    <div><b>1888</b><span>«Año de los tres emperadores»: mueren Guillermo I y Federico III, y asciende Guillermo II.</span></div>
    <div><b>1890</b><span>Bismarck deja el cargo de canciller.</span></div>
    <div><b>1898</b><span>Primera ley naval impulsada por Tirpitz: nace la gran flota de alta mar.</span></div>
    <div><b>1914</b><span>Estalla la Primera Guerra Mundial.</span></div>
    <div><b>Marzo de 1918</b><span>Tratado de Brest-Litovsk con la Rusia revolucionaria.</span></div>
    <div><b>9 de noviembre de 1918</b><span>Guillermo II abdica y se proclama la república. El armisticio llega el 11 de noviembre.</span></div>

  'Gobernantes':`<h4>Emperadores</h4>

/* ---------- Modal ---------- */
const veil=$('veil'),panel=$('panel');
function show(wide){panel.classList.toggle('wide',!!wide);veil.classList.add('open');const x=panel.querySelector('.x');if(x)x.onclick=close}
function close(){veil.classList.remove('open')}
veil.addEventListener('click',e=>{if(e.target===veil)close()});
addEventListener('keydown',e=>{if(e.key==='Escape')close()});

/* ---------- Sesión ---------- */
const store={
  get(){try{return JSON.parse(localStorage.getItem('gia_user')||'null')}catch(e){return null}},
  set(u){try{u?localStorage.setItem('gia_user',JSON.stringify(u)):localStorage.removeItem('gia_user')}catch(e){}}
};
let user=store.get();
function renderSession(){
  document.body.classList.toggle('guest',!user);
  $('acct').classList.toggle('on',!!user);$('btnSign').style.display=user?'none':'';
  if(user){
    const av=user.avatar?`<img src="${esc(user.avatar)}" alt="">`:`<span class="av">${esc((user.name||'?')[0]).toUpperCase()}</span>`;
    const tag={discord:'Discord',roblox:'Roblox'}[user.provider]||'Invitado';
    $('chip').innerHTML=`${av}<span class="n">${esc(user.name)}</span><small>${tag}</small>`;
    $('intro').innerHTML=`Bienvenido, ${esc(user.name)}. Las puertas del Reich están abiertas: entra al <a data-open="army">Ejército Imperial Alemán</a>, despacha en la <a data-open="chan">Cancillería</a>, recorre los <a data-open="min">Ministerios</a> o lee la historia en el <a data-open="fan">Fandom Imperio Alemán</a>.`;
  }else{
    $('intro').innerHTML=`Los salones están sellados. Inicia sesión una vez con Discord o Roblox y se abrirán el <a data-open="army">Ejército Imperial Alemán</a>, la <a data-open="chan">Cancillería</a> y los <a data-open="min">Ministerios</a>. Sin llave puedes leer la historia en el <a data-open="fan">Fandom Imperio Alemán</a>.`;
  }
}
function openHall(k){
  if(k==='fan')return openFandom();
  if(!user)return openSign();
  const h=HALLS[k];
  panel.innerHTML=`<button class="x" aria-label="Cerrar">&times;</button>
    <svg class="big" viewBox="0 0 100 100"><use href="#${h.sym}"/></svg>
    <h3>${h.title}</h3><div class="motto">${h.motto}</div><p class="desc">${h.desc}</p>
    <ul>${h.items.map(i=>`<li class="it"><strong>${i[0]}</strong><span>${i[1]}</span></li>`).join('')}</ul>`;
  show();
}
function openFandom(){
  const names=Object.keys(WIKI);
  panel.innerHTML=`<button class="x" aria-label="Cerrar">&times;</button>
    <svg class="big" viewBox="0 0 100 100"><use href="#e-fan"/></svg>
    <h3>Fandom Imperio Alemán</h3><div class="motto">Historia del Deutsches Kaiserreich, 1871 – 1918</div>
    <div class="tabs">${names.map((n,i)=>`<button class="tab${i?'':' on'}" data-t="${n}">${n}</button>`).join('')}</div>
    <div class="wiki" id="wiki">${WIKI[names[0]]}</div>`;
  show(true);
  panel.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    panel.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));$('wiki').innerHTML=WIKI[b.dataset.t];
  });
}

/* Roblox: usuario (o ID / enlace de perfil) + código en la descripción */
async function rbxGet(bases,path,opts){
  let last=null;
  for(const b of bases){
    try{const r=await fetch(b+path,opts);if(r.ok)return await r.json();last=new Error('HTTP '+r.status)}
    catch(e){last=e}
  }
  throw last||new Error('sin respuesta');
}
async function rbxFind(input){
  const m=input.match(/users\/(\d+)/)||input.match(/^(\d{3,})$/);
  if(m){const d=await rbxGet(CONFIG.ROBLOX_USERS,`/v1/users/${m[1]}`);return{id:d.id,name:d.displayName||d.name}}
  try{
    const d=await rbxGet(CONFIG.ROBLOX_USERS,`/v1/users/search?keyword=${encodeURIComponent(input)}&limit=10`);
    const list=d.data||[];const u=list.find(x=>x.name.toLowerCase()===input.toLowerCase())||list[0];
    if(u)return{id:u.id,name:u.displayName||u.name};
  }catch(e){}
  const d=await rbxGet(CONFIG.ROBLOX_USERS,'/v1/usernames/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usernames:[input],excludeBannedUsers:true})});
  const u=d.data&&d.data[0];return u?{id:u.id,name:u.displayName||u.name}:null;
}
let rbx=null;
function robloxStep1(){
  panel.innerHTML=`<button class="x" aria-label="Cerrar">&times;</button>
    <h3>Roblox</h3><div class="motto">Comprueba que la cuenta es tuya.</div>
    <label for="ru">Tu usuario, tu ID o el enlace de tu perfil</label>
    <input class="f" id="ru" maxlength="120" placeholder="Usuario o roblox.com/users/123456/profile" autocomplete="off">
    <button class="btn" id="rgo">Continuar</button>
    <div class="warn" id="warn"></div>
    <button class="btn ghost" id="rback">Volver</button>`;
  show();$('ru').focus();$('rback').onclick=openSign;
  const go=async()=>{
    const n=$('ru').value.trim();if(!n)return;
    $('warn').textContent='Buscando…';
    try{
      const u=await rbxFind(n);
      if(!u){$('warn').textContent='No encontré ese usuario. Prueba pegando el enlace de tu perfil de Roblox.';return}
      let avatar='';
      try{const t=await rbxGet(CONFIG.ROBLOX_THUMBS,`/v1/users/avatar-headshot?userIds=${u.id}&size=150x150&format=Png`);avatar=t.data&&t.data[0]&&t.data[0].imageUrl||''}catch(e){}
      rbx={id:u.id,name:u.name,avatar,code:'IMPERIO-'+Math.random().toString(36).slice(2,8).toUpperCase()};
      robloxStep2();
    }catch(e){$('warn').textContent='No pude conectar con Roblox ('+(e&&e.message||'error')+'). Inténtalo otra vez en unos segundos.'}
  };
  $('rgo').onclick=go;$('ru').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}
function robloxStep2(){
  panel.innerHTML=`<button class="x" aria-label="Cerrar">&times;</button>
    <h3>Hola, ${esc(rbx.name)}</h3><div class="motto">Un último paso</div>
    <ol class="steps"><li>Copia este código.</li><li>En Roblox abre tu perfil y pégalo en la descripción («Acerca de»). Guarda.</li><li>Vuelve aquí y pulsa Verificar.</li></ol>
    <div class="code">${rbx.code}</div>
    <button class="btn" id="rver">Verificar</button>
    <div class="warn" id="warn"></div>
    <button class="btn ghost" id="rback">Volver</button>`;
  show();$('rback').onclick=robloxStep1;
  $('rver').onclick=async()=>{
    $('warn').textContent='Comprobando…';
    try{
      const d=await rbxGet(CONFIG.ROBLOX_USERS,`/v1/users/${rbx.id}`);
      if((d.description||'').includes(rbx.code)){user={name:rbx.name,provider:'roblox',id:rbx.id,avatar:rbx.avatar};store.set(user);renderSession();close()}
      else $('warn').textContent='Todavía no veo el código en tu descripción. Guarda el cambio en Roblox y vuelve a pulsar Verificar.';
    }catch(e){$('warn').textContent='No pude conectar con Roblox ('+(e&&e.message||'error')+'). Inténtalo otra vez.'}
  };
}

const audio=new Audio();audio.preload='auto';audio.volume=.8;

function setUI(){const p=!audio.paused;$('music').classList.toggle('on',p);$('mtxt').textContent=p?'Música ON':'Música OFF'}
['play','pause','playing'].forEach(ev=>audio.addEventListener(ev,setUI));
function load(i){idx=(i+tracks.length)%tracks.length;audio.src=tracks[idx];return audio.play()}
function advance(){load(idx+1).catch(()=>{})}               // al terminar la última vuelve a la primera
audio.addEventListener('ended',()=>{errRun=0;advance()});
audio.addEventListener('playing',()=>{errRun=0});
audio.addEventListener('error',()=>{if(++errRun<=tracks.length&&tracks.length>1)advance()});

/* ---------- Bombardeo de artillería al fondo ---------- */
const war=$('war'),wx=war.getContext('2d');let W,H,shells=[],booms=[],smoke=[],debris=[],warRaf=0;
function wsize(){W=war.width=innerWidth;H=war.height=innerHeight}wsize();addEventListener('resize',wsize);
const rnd=(a,b)=>a+Math.random()*(b-a);
function fire(big){
  const tx=rnd(.04,.96)*W,ty=rnd(.28,.95)*H;
  shells.push({x:tx+rnd(-160,-60),y:-30,tx,ty,t:0,dur:rnd(380,560),big:big||Math.random()<.25,t0:performance.now()});
  if(!warRaf)warRaf=requestAnimationFrame(warTick);
}
function salvo(n){for(let i=0;i<n;i++)setTimeout(()=>fire(i===0),i*rnd(160,420))}
function explode(x,y,big){
  const R=(big?rnd(110,170):rnd(60,105))*Math.min(1,Math.max(.6,W/1100));
  booms.push({x,y,R,t0:performance.now()});
  for(let i=0;i<(big?16:10);i++)smoke.push({x:x+rnd(-R*.5,R*.5),y:y+rnd(-R*.3,R*.3),r:rnd(R*.25,R*.5),g:rnd(.25,.6),vx:rnd(-.25,.25),vy:rnd(-.5,-.15),l:1,d:rnd(.003,.006)});
  for(let i=0;i<(big?44:26);i++){const a=rnd(0,6.28),v=rnd(2,9);debris.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rnd(1,4),l:1,d:rnd(.014,.03),r:rnd(1,2.8),c:['#fff4c2','#ffc04a','#ff7a2a','#e0183a'][i%4]})}
  if(big&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const m=document.querySelector('main');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake')}
}
function warTick(now){
  wx.clearRect(0,0,W,H);
  // humo
  smoke=smoke.filter(p=>p.l>0);
  for(const p of smoke){p.x+=p.vx;p.y+=p.vy;p.r+=.35;p.l-=p.d;
    wx.globalAlpha=Math.max(p.l,0)*.34;
    const g=wx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(${50+p.g*60|0},${46+p.g*56|0},${48+p.g*56|0},1)`);g.addColorStop(1,'rgba(80,76,78,0)');
    wx.fillStyle=g;wx.beginPath();wx.arc(p.x,p.y,p.r,0,6.28);wx.fill()}
  // proyectiles
  shells=shells.filter(s=>{
    const k=(now-s.t0)/s.dur;
    if(k>=1){explode(s.tx,s.ty,s.big);return false}
    const e=k*k,x=s.x+(s.tx-s.x)*e,y=s.y+(s.ty-s.y)*e,px=s.x+(s.tx-s.x)*Math.max(e-.12,0),py=s.y+(s.ty-s.y)*Math.max(e-.12,0);
    wx.globalAlpha=.9;const g=wx.createLinearGradient(px,py,x,y);g.addColorStop(0,'rgba(255,170,60,0)');g.addColorStop(1,'rgba(255,120,30,.95)');
    wx.strokeStyle=g;wx.lineWidth=3;wx.lineCap='round';wx.beginPath();wx.moveTo(px,py);wx.lineTo(x,y);wx.stroke();
    wx.fillStyle='#fff';wx.beginPath();wx.arc(x,y,2.2,0,6.28);wx.fill();
    return true});
  // explosiones
  booms=booms.filter(b=>{
    const t=(now-b.t0)/1000;if(t>1.1)return false;
    const grow=Math.min(1,t/.35),ease=1-Math.pow(1-grow,3);
    // onda
    wx.globalAlpha=Math.max(0,.6-t*.6);wx.strokeStyle='rgba(255,255,255,.95)';wx.lineWidth=3;wx.beginPath();wx.arc(b.x,b.y,b.R*(.3+ease*1.9),0,6.28);wx.stroke();
    wx.globalAlpha=Math.max(0,.5-t*.5);wx.strokeStyle='rgba(120,90,60,.7)';wx.lineWidth=1.5;wx.beginPath();wx.arc(b.x,b.y,b.R*(.3+ease*2.1),0,6.28);wx.stroke();
    // bola de fuego
    const fr=b.R*(.25+ease*.85);wx.globalAlpha=Math.max(0,1-t*1.05);
    const g=wx.createRadialGradient(b.x,b.y,0,b.x,b.y,fr);g.addColorStop(0,'rgba(255,255,235,1)');g.addColorStop(.25,'rgba(255,214,110,.98)');g.addColorStop(.6,'rgba(255,110,30,.85)');g.addColorStop(1,'rgba(200,16,46,0)');
    wx.fillStyle=g;wx.beginPath();wx.arc(b.x,b.y,fr,0,6.28);wx.fill();
    // destello inicial
    if(t<.14){wx.globalAlpha=(.14-t)/.14*.55;wx.fillStyle='rgba(255,236,170,1)';wx.beginPath();wx.arc(b.x,b.y,b.R*1.9,0,6.28);wx.fill()}
    return true});
  // chispas y escombros
  debris=debris.filter(p=>p.l>0);
  for(const p of debris){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.985;p.l-=p.d;
    wx.globalAlpha=Math.max(p.l,0);wx.fillStyle=p.c;wx.beginPath();wx.arc(p.x,p.y,p.r,0,6.28);wx.fill()}
  wx.globalAlpha=1;
  warRaf=(shells.length||booms.length||smoke.length||debris.length)?requestAnimationFrame(warTick):0;
}
function bang(){salvo(3)}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
  setTimeout(()=>salvo(2),600);
  (function loop(){setTimeout(()=>{if(!document.hidden)salvo(Math.random()<.35?3:1);loop()},rnd(1400,3200))})();
}

/* ---------- Distorsión del título ---------- */
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const gl=document.querySelector('.gl'),turb=$('turb');
  setInterval(()=>{
    gl.classList.add('burst');let n=0;
    const iv=setInterval(()=>{turb.setAttribute('seed',Math.floor(Math.random()*90));turb.setAttribute('baseFrequency','0.01 '+(.15+Math.random()*.5).toFixed(2));if(++n>5){clearInterval(iv);gl.classList.remove('burst')}},55);
  },2600);
})();

/* ---------- Nieve ---------- */
(function(){
  const c=$('snow'),x=c.getContext('2d');let w,h,F=[];
  function size(){w=c.width=innerWidth;h=c.height=innerHeight}size();addEventListener('resize',size);
  const N=matchMedia('(max-width:640px)').matches?70:140;
  for(let i=0;i<N;i++)F.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.6+.6,v:Math.random()*.9+.35,d:Math.random()*6.28,s:Math.random()*.02+.005});
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){x.fillStyle='rgba(255,255,255,.8)';F.forEach(p=>{x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()});return}
  let t=0;
  (function tick(){
    t+=.003;x.clearRect(0,0,w,h);const wind=Math.sin(t)*.5;
    for(const p of F){
      p.y+=p.v;p.d+=p.s;p.x+=Math.sin(p.d)*.5+wind*(p.r/3);
      if(p.y>h+6){p.y=-6;p.x=Math.random()*w}if(p.x>w+6)p.x=-6;if(p.x<-6)p.x=w+6;
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fillStyle=`rgba(255,255,255,${.7+p.r/10})`;x.shadowColor='rgba(70,120,180,.7)';x.shadowBlur=p.r*2.5;x.fill();
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
